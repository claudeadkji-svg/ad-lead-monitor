name: weekly-report

on:
  schedule:
    # 매주 월요일 07:00 KST (일요일 22:00 UTC)
    - cron: "0 22 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install openpyxl

      - name: Build weekly report
        run: python scraper/weekly_report.py

      - name: Commit & push
        run: |
          git config user.name "lead-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/reports
          git diff --cached --quiet || git commit -m "report: weekly $(TZ=Asia/Seoul date +%F)"
          git push
