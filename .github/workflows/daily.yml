name: daily-collect

on:
  schedule:
    # 매일 06:30 KST (21:30 UTC)
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
        run: python scraper/main.py

      - name: Commit & push data
        run: |
          git config user.name "lead-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: daily collect $(TZ=Asia/Seoul date +%F)"
          git push
